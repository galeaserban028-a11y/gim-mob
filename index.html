<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GIM MOB Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#141414;--panel2:#1c1c1c;--line:#2a2a2a;--gold:#d8b46e;--gold2:#a77d3c;--txt:#ece8e1;--mut:#9a948a;--blue:#2f55ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:78px 1fr 344px;grid-template-rows:60px 1fr;grid-template-areas:"top top top" "tools view panel"}
#top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0a0a0a;border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:44px;border-radius:6px;display:block}
.brand b{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.14em;background:linear-gradient(180deg,#f3dca2,#b3843f);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.brand span{font-size:9.5px;letter-spacing:.45em;color:var(--mut);display:block;margin-top:2px}
.pname{flex:1;text-align:center;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname b{color:var(--txt);font-weight:600}
.tb{display:flex;gap:6px;margin-left:auto}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:active{transform:scale(.95)}
.ib svg{width:19px;height:19px}
.ib:disabled{opacity:.35}
#tools{grid-area:tools;background:#0a0a0a;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;z-index:6}
#tools button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:13px;font:500 10px Inter,sans-serif;cursor:pointer;white-space:nowrap}
#tools button svg{width:23px;height:23px}
#tools button.on{background:linear-gradient(180deg,#2b2417,#1a160e);color:var(--gold);box-shadow:inset 0 0 0 1px #4d3d20}
#tools button:hover{color:var(--txt)}
#view{grid-area:view;position:relative;overflow:hidden;background:#f1efea}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 28px;z-index:4}
.grab{display:none}
/* floating bars */
.fbar{position:absolute;display:flex;gap:4px;background:rgba(14,14,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2c2c2c;border-radius:14px;padding:4px;z-index:3}
.fbar button{border:0;background:none;color:#cfc9bf;font:600 12px Inter,sans-serif;padding:7px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}
.fbar button.on{background:linear-gradient(180deg,#e2c27f,#b68c48);color:#141007}
#viewbar{top:12px;right:12px}
.fbar[hidden]{display:none}
#ctx{position:fixed;z-index:70;background:#151515;border:1px solid #3a3020;border-radius:14px;padding:6px;min-width:230px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
#ctx[hidden]{display:none}
#ctx .ctxh{font:600 11px Inter;color:var(--gold);padding:6px 10px 8px;letter-spacing:.04em;border-bottom:1px solid #262626;margin-bottom:4px}
#ctx button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px;border-radius:9px;font:500 13.5px Inter;cursor:pointer;text-align:left}
#ctx button:hover{background:#221d13}
#ctx button svg{width:17px;height:17px;color:var(--gold)}
#ctx button.red,#ctx button.red svg{color:#ff8b7b}
.rb.sel{transform:translate(-50%,-50%) scale(1.22);box-shadow:0 0 0 3px #fff,0 6px 20px rgba(0,0,0,.6)}
.rwrap.mob .rb em{display:none}
#rgo{margin-top:6px;padding:6px 14px;font-size:12px}
.tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
a{color:var(--gold)}
#drawbar{top:12px;left:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
#drawbar .lbl{color:var(--gold);font:600 11px Inter;padding:7px 6px 7px 8px;letter-spacing:.06em;text-transform:uppercase}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(14,14,14,.88);color:#e9e2d4;padding:9px 14px;border-radius:12px;font-size:12.5px;z-index:3;pointer-events:none;max-width:calc(100% - 24px);text-align:center;border:1px solid #3a301c;transition:opacity .3s}
#hint:empty{opacity:0}
#modeTag{position:absolute;left:12px;bottom:14px;z-index:3;background:rgba(14,14,14,.86);color:var(--gold);font:600 11px Inter;padding:6px 10px;border-radius:10px;border:1px solid #3a301c;letter-spacing:.05em}
#modeTag:empty{display:none}
/* panel ui */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ph .ic{width:52px;height:52px;border-radius:12px;background:#fff8ec;display:grid;place-items:center;flex:none}
.ph .ic svg{width:44px;height:44px}
.ph h3{margin:0;font:600 16px Inter}
.ph small{color:var(--mut);font-size:12px}
.ph .x{margin-left:auto}
.sec{border-top:1px solid #242424;padding:12px 0 4px;margin-top:6px}
.sec h4{margin:0 0 9px;font:600 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:block;position:relative}
.fld span{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,textarea.inp,input.inp{width:100%;background:#0e0e0e;border:1px solid #2e2e2e;border-radius:10px;color:var(--txt);padding:10px 30px 10px 10px;font:500 14px Inter;outline:none;-moz-appearance:textfield}
input.inp{padding-right:10px}
.fld input:focus,textarea.inp:focus,input.inp:focus{border-color:var(--gold2)}
.fld i{position:absolute;right:9px;bottom:11px;font-style:normal;font-size:11px;color:#6d675e;pointer-events:none}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:flex;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:11px;padding:3px;gap:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;color:#bdb6aa;padding:8px 4px;border-radius:8px;font:600 12px Inter;cursor:pointer}
.seg button.on{background:#2a2419;color:var(--gold);box-shadow:inset 0 0 0 1px #4b3c20}
.lab{font-size:11px;color:var(--mut);margin:2px 0 5px}
.sws{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #2b2b2b;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px #0e0e0e inset,0 0 0 1px var(--gold)}
.sw.def{background:#0e0e0e;color:var(--mut);font:600 9px Inter;width:auto;border-radius:17px;padding:0 9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #333;background:#1e1e1e;color:var(--txt);border-radius:12px;padding:11px 14px;font:600 13px Inter;cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#e7c784,#b3873f);color:#171108;border-color:#c59c55}
.btn.red{color:#ff8b7b;border-color:#4a2620;background:#1f1412}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.acts .full{grid-column:1/-1}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.note b{color:#d9d2c6}
.chip{display:inline-block;font:600 10px Inter;padding:3px 7px;border-radius:7px;background:#221d13;color:var(--gold);letter-spacing:.04em}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}
.tog input{width:20px;height:20px;accent-color:#c59c55}
/* radial */
#radial{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#radial[hidden]{display:none}
.rwrap{position:relative}
.rcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a2417,#100e0a);border:1px solid #5a4625;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.rcenter b{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--gold);letter-spacing:.06em}
.rcenter span{font-size:10.5px;color:#cfc7b8;line-height:1.25;margin-top:2px}
.rb{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#fbf7ef;border:3px solid var(--c);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .12s}
.rb:hover,.rb:active{transform:translate(-50%,-50%) scale(1.12)}
.rb svg{width:40px;height:40px}
.rb em{position:absolute;top:61px;left:50%;transform:translateX(-50%);width:84px;font:600 9.5px/1.15 Inter;font-style:normal;color:#eee;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none}
.rleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:11px;color:#cfc7b8;max-width:94vw}
.rleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rclose{position:absolute;top:14px;right:14px}
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.card{background:#151515;border:1px solid #2f2f2f;border-radius:20px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card.wide{width:min(980px,100%)}
.card h2{margin:0 0 4px;font:700 20px 'Cormorant Garamond',serif;letter-spacing:.04em;color:var(--gold)}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.mh{display:flex;align-items:flex-start;gap:10px}
.mh .ib{margin-left:auto;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid #2a2a2a;margin:8px 0 12px}
.tabs button{border:0;background:none;color:var(--mut);padding:9px 12px;font:600 13px Inter;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
.prev{display:flex;align-items:center;gap:14px;background:#fbf7ef;border-radius:14px;padding:12px;color:#222;margin:10px 0}
.prev svg{width:84px;height:84px;flex:none}
.prev b{display:block;font-size:15px}
.prev small{color:#6b6255}
table.cl{width:100%;border-collapse:collapse;font-size:12.5px}
.cl th{text-align:left;color:var(--gold);font:600 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid #333;position:sticky;top:0;background:#151515}
.cl td{padding:7px 6px;border-bottom:1px solid #222}
.cl td.n{text-align:right;font-variant-numeric:tabular-nums}
.cl tr.grp td{background:#1d1a14;color:var(--gold);font-weight:600}
.tscroll{overflow:auto;max-height:52vh;border:1px solid #262626;border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#1b1b1b;border:1px solid #2a2a2a;border-radius:14px;padding:10px 12px}
.kpi small{display:block;color:var(--mut);font-size:11px}
.kpi b{font-size:18px}
.kpi.g b{color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pitem{display:flex;align-items:center;gap:8px;background:#1b1b1b;border:1px solid #2a2a2a;border-radius:12px;padding:8px 10px}
.pitem span{flex:1;font-weight:600}
.pitem small{color:var(--mut)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:10px 0}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.steps div:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#e7c784,#b3873f);color:#171108;display:grid;place-items:center;font-weight:700}
.shot{width:100%;border-radius:12px;display:block;background:#eee}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#1f1a10;border:1px solid #5a4625;color:#f2e6cc;padding:10px 16px;border-radius:12px;font-size:13px;z-index:80;transition:all .25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#splash img{width:170px;border-radius:10px}
#splash span{font:600 11px Inter;letter-spacing:.5em;color:var(--gold)}
#splash.off{opacity:0;pointer-events:none}
#err{position:fixed;inset:auto 12px 80px 12px;background:#2a1212;color:#ffb4a8;padding:12px;border-radius:12px;z-index:200;font-size:12px;display:none}
@media (max-width:860px){
 #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 68px;grid-template-areas:"top" "view" "tools"}
 #top{padding:0 10px;gap:8px}
 .brand img{height:38px}
 .brand b{font-size:20px}
 .brand span{font-size:8.5px}
 .pname{display:none}
 #tools button svg{width:21px;height:21px}
 .tb{gap:5px}
 .ib{width:36px;height:36px}
 #tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:5px 3px;justify-content:space-around;gap:0}
 #tools button{flex:1;padding:6px 0 4px;font-size:8.8px;gap:3px;min-width:0}
 #tools button svg{width:22px;height:22px}
 #panel{position:fixed;left:0;right:0;bottom:68px;max-height:54vh;border-left:0;border-top:1px solid #3d3220;border-radius:20px 20px 0 0;transform:translateY(calc(100% + 80px));transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:20;box-shadow:0 -14px 40px rgba(0,0,0,.55);padding-top:6px}
 #panel.open{transform:none}
 .grab{display:block;width:44px;height:5px;border-radius:3px;background:#3a3a3a;margin:2px auto 10px}
 #viewbar{top:auto;bottom:12px;right:10px}
 #viewbar button{padding:7px 8px;font-size:11px}
 #hint{bottom:58px}
 #modeTag{bottom:58px}
 .kpis{grid-template-columns:1fr 1fr}
 .card{border-radius:20px 20px 0 0;max-height:92%;align-self:flex-end}
 #modal{padding:0;align-items:flex-end}
 .rb{width:50px;height:50px}
 .rb svg{width:34px;height:34px}
 .rb em{top:52px;width:70px;font-size:8.8px}
 .rcenter{width:96px;height:96px}
 .rcenter b{font-size:17px}
 .rcenter span{font-size:9.5px}
}
</style>

function holesFor(parts){
 const Hs=[],J=S.std.join;
 const verts=parts.map((p,i)=>({p,i})).filter(o=>/^side|^div/.test(o.p.role));

 const add=(pi,x,y,z,ax,sg,d,dep,k)=>{if(pi>=0)Hs.push({pi,x,y,z,ax,sg,d,dep,k});};
 parts.forEach((p,i)=>{
  if(p.role==='hz'){
   const dz=p.z1-p.z0,zs=dz>300?[p.z0+37,p.z1-37].concat(dz>650?[(p.z0+p.z1)/2]:[]):[(p.z0+p.z1)/2],yc=(p.y0+p.y1)/2;
   const lowPanel=yc<(parts.find(q=>q.role==='sideL')||p).y1/2;
   for(const[xe,sg]of[[p.x0,-1],[p.x1,1]]){
    const vi=vAt(xe+sg*2,yc,zs[0]);if(vi<0)continue;const v=parts[vi];
    for(const z of zs){
     if(J==='confirmat'){add(vi,sg<0?v.x0:v.x1,yc,z,'x',sg,7,v.x1-v.x0,'joint');add(i,xe,yc,z,'x',sg,5,50,'jointE');}
     else if(J==='excentric'){add(i,xe-sg*34,lowPanel?p.y1:p.y0,z,'y',lowPanel?1:-1,15,13,'joint');add(vi,xe,yc,z,'x',-sg,8,12,'joint');add(i,xe,yc,z,'x',sg,8,34,'jointE');}
     else{add(vi,xe,yc,z,'x',-sg,8,12,'joint');add(i,xe,yc,z,'x',sg,8,30,'jointE');}
    }}
  }
  if(p.role==='shelf'){for(const[xe,sg]of[[p.x0,-1],[p.x1,1]]){const vi=vAt(xe+sg*2,p.y0,(p.z0+p.z1)/2);if(vi<0)continue;const v=parts[vi];for(const z of[p.z0+37,p.z1-37])add(vi,sg<0?v.x1:v.x0,p.y0-6,z,'x',-sg,5,12,'pin');}}
  if(p.role==='door'){
   const fh=p.y1-p.y0,n=(p.a&&+(S._curItem?.o?.hinges)||0)||(fh<=900?2:fh<=1600?3:fh<=2200?4:5);
   const ys=[...Array(n)].map((_,k)=>p.y0+100+(fh-200)*k/(n-1));
   const L=p.a.hinge==='L',zF=p.z0-2;
   for(const y of ys){add(i,L?p.x0+22.5:p.x1-22.5,y,p.z0,'z',-1,35,13,'hinge');
    const vi=vAt(L?p.x0+9:p.x1-9,y,zF-37);if(vi>=0){const v=parts[vi];for(const z of[zF-37,zF-69])add(vi,L?v.x1:v.x0,y,z,'x',L?1:-1,5,12,'plate');}}
  }
  if(p.role==='dside'&&p.x0<0){
   const vi=vAt(p.x0-15,p.y0+8,p.z1-40);const vj=vAt(-p.x0+15,p.y0+8,p.z1-40);
   for(const[v,sg]of[[vi,1],[vj,-1]]){if(v<0)continue;const q=parts[v];const zs=[p.z1-35];if(p.z1-p.z0>300)zs.push(p.z1-35-224);if(p.z1-p.z0>450)zs.push(p.z1-35-352);for(const z of zs)add(v,sg>0?q.x1:q.x0,p.y0+8,z,'x',sg,5,12,'slide');}
  }

function rectFromDrag(d){
 const R=S.room,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 let x0=Math.min(d.p0.x,d.p1.x),x1=Math.max(d.p0.x,d.p1.x),z0=Math.min(d.p0.z,d.p1.z),z1=Math.max(d.p0.z,d.p1.z);
 x0=snap10(cl(x0,0,R.w));x1=snap10(cl(x1,0,R.w));z0=snap10(cl(z0,0,R.d));z1=snap10(cl(z1,0,R.d));
 if(x1-x0<60&&z1-z0<60){x0=Math.max(0,x0-300);x1=x0+600;z0=0;z1=PRESETS[drawPre].d;}
 return{x0,x1,z0,z1};
}
function spaceFromDrag(d){
 const R=S.room,pre=PRESETS[drawPre];let{x0,x1,z0,z1}=rectFromDrag(d);
 const dl=R.left?x0:1e9,dr=R.right?R.w-x1:1e9,db=z0,m=Math.min(db,dl,dr);
 if(m===db||m>400){const w=Math.max(100,x1-x0),dep=Math.max(100,z1-z0<150?pre.d:z1-z0);return makeSpace({wall:'back',w,d:dep,s:x0+w/2,h:pre.h,e:pre.e,off:m>400?Math.max(0,z0):0});}
 const w=Math.max(100,z1-z0),dep=Math.max(100,x1-x0<150?pre.d:x1-x0);
 return makeSpace({wall:m===dl?'left':'right',w,d:dep,s:z0+w/2,h:pre.h,e:pre.e});
}

 const list=S.items.filter(band).sort((a,b)=>a.s-b.s);let i=list.indexOf(it);if(i<0)return{run:[it],L:it.s-it.w/2,R:it.s+it.w/2,counters:[]};let lo=i,hi=i;
 while(lo>0&&Math.abs((list[lo-1].s+list[lo-1].w/2)-(list[lo].s-list[lo].w/2))<6)lo--;
 while(hi<list.length-1&&Math.abs((list[hi].s+list[hi].w/2)-(list[hi+1].s-list[hi+1].w/2))<6)hi++;
 const run=list.slice(lo,hi+1),L=run[0].s-run[0].w/2,R=run[run.length-1].s+run[run.length-1].w/2;
 const counters=S.items.filter(o=>o.type==='counter'&&o.wall===it.wall&&o.s-o.w/2>=L-30&&o.s+o.w/2<=R+30&&Math.abs(o.e-(Math.max(...run.map(r=>r.e+r.h))))<60);

function wallGaps(wall,y0,y1){

  if(o.wall===wall&&(o.off||0)<100)occ.push([o.s-o.w/2,o.s+o.w/2]);

function bbox(it){const p=placement(it),along=it.w/2,perp=it.d/2;return it.wall==='back'?{x0:p.cx-along,x1:p.cx+along,z0:p.cz-perp,z1:p.cz+perp,y0:it.e,y1:it.e+it.h}:{x0:p.cx-perp,x1:p.cx+perp,z0:p.cz-along,z1:p.cz+along,y0:it.e,y1:it.e+it.h};}
function runChecks(){
 const out=[],R=S.room,cabs=S.items.filter(i=>i.kind==='cab'&&!i.hidden),bx=new Map(cabs.map(c=>[c,bbox(c)]));
 const ov=(a,b,t=2)=>a.x0<b.x1-t&&a.x1>b.x0+t&&a.z0<b.z1-t&&a.z1>b.z0+t&&a.y0<b.y1-t&&a.y1>b.y0+t;
 for(let i=0;i<cabs.length;i++)for(let j=i+1;j<cabs.length;j++)if(ov(bx.get(cabs[i]),bx.get(cabs[j])))out.push({lvl:'err',id:cabs[i].id,msg:`${cabCode(cabs[i])} se suprapune cu ${cabCode(cabs[j])}`});

  if(b.x0<-1||b.x1>R.w+1||b.z0<-1||b.z1>R.d+1||b.y1>R.h+1)out.push({lvl:'err',id:c.id,msg:`${nm} iese din cameră`});

   if(p.role==='door'&&w>620)out.push({lvl:'warn',id:c.id,msg:`${nm}: ușă lată de ${Math.round(w)} mm (peste 600 se poate lăsa)`});

 }

/* ================== PRODUCȚIE ================== */
function axesOf(p){const e={x:p.x1-p.x0,y:p.y1-p.y0,z:p.z1-p.z0};const ax=['x','y','z'].sort((a,b)=>e[b]-e[a]);return{A:ax[0],B:ax[1],C:ax[2],e};}
function allParts(filterId){
 const out=[];let ci=0;
 for(const it of S.items){if(it.kind!=='cab')continue;ci++;if(filterId&&it.id!==filterId)continue;const code='C'+ci;
  S._curItem=it;const parts=partsFor(it),holes=holesFor(parts);S._curItem=null;let k=0;
  parts.forEach((p,pi)=>{if(!p.cut)return;k++;const{A,B,C,e}=axesOf(p);const L=Math.round(e[A]),W=Math.round(e[B]),th=Math.round(e[C]);const dec=decorOf(p,it);
   let edges={L1:0,L2:0,W1:0,W2:0};const allE=p.mat==='front'&&p.cant>0;
   if(allE)edges={L1:1,L2:1,W1:1,W2:1};else if(p.cant>0&&p.mat!=='back'){if(p.cn===B)edges.L1=1;else if(p.cn===A)edges.W1=1;}
   const cantMM=(edges.L1+edges.L2)*L+(edges.W1+edges.W2)*W;
   const hs=holes.filter(h=>h.pi===pi).map(h=>{const face=h.ax===C;const u=h[A]-p[A+'0'],v=h[B]-p[B+'0'];return{face,u:Math.round(u*10)/10,v:Math.round(v*10)/10,d:h.d,dep:h.dep,k:h.k,side:face?(h.sg>0?'B':'A'):(h.ax===A?(h.sg>0?'L2':'L1')+'':(h.sg>0?'W2':'W1'))};});
   out.push({pid:`${code}-${k}`,code,cab:TYPES[it.type].n,item:it,name:p.name,L,W,th,dec,mat:p.mat,edges,cantMM,grain:!!dec.wood,holes:hs,thin:p.mat==='front'?'2 mm':'0.4 mm'});});
  // feronerie
  parts.forEach(p=>{if(p.name==='Mâner')out.push({hw:'man',item:it});if(p.name==='Picior')out.push({hw:'pic',item:it});if(p.name==='Bară umeraș')out.push({hw:'bara',item:it});
   if(p.role==='door'){const fh=p.y1-p.y0,n=(+it.o.hinges)||(fh<=900?2:fh<=1600?3:fh<=2200?4:5);for(let i=0;i<n;i++)out.push({hw:'bal',item:it});}
   if(p.role==='dfront')out.push({hw:'glis',item:it});if(p.role==='lift')out.push({hw:'rab',item:it});});
 }
 return out;
}
function production(filterId){
 const all=allParts(filterId),parts=all.filter(p=>!p.hw),acc={bal:0,glis:0,man:0,pic:0,rab:0,bara:0};all.filter(p=>p.hw).forEach(p=>acc[p.hw]++);

 for(const p of parts){const key=[p.name,p.L,p.W,p.th,p.dec.id].join('|');if(!rows[key])rows[key]={...p,qty:0,ids:[]};rows[key].qty++;rows[key].ids.push(p.pid);
  cant+=p.cantMM;const a=p.L*p.W/1e6;if(p.mat==='back')area.hdf+=a;else if(p.mat==='counter')area.blat+=a;else if(p.mat==='front')area.front+=a;else area.pal+=a;}
 const NO=['Lateral stânga','Lateral dreapta','Bază','Capac','Legătură față','Legătură spate','Separator','Poliță fixă','Poliță','Poliță cuptor','Ușă','Front sertar','Front sertar int.','Front rabatabil','Panou orb','Soclu','Soclu spate','Panou lateral','Lată completare','Poliță perete','Blat','Spate HDF','Sertar lateral','Sertar spate','Sertar față int.','Sertar fund HDF'],ix=n=>{const i=NO.indexOf(n);return i<0?99:i};
 const list=Object.values(rows).sort((a,b)=>(b.th-a.th)||a.dec.n.localeCompare(b.dec.n)||ix(a.name)-ix(b.name)||b.L-a.L);
 const R=S.rates,nest=filterId?null:nesting(parts);

/* ---- optimizare plăci (MaxRects) ---- */
class Bin{constructor(W,H){this.W=W;this.H=H;this.free=[{x:0,y:0,w:W,h:H}];this.used=[];}
 find(w,h,rot){let best=null;const tr=(x,y,rw,rh,f,r)=>{const s=Math.min(f.w-rw,f.h-rh),s2=Math.max(f.w-rw,f.h-rh);if(!best||s<best.score||(s===best.score&&s2<best.s2))best={x,y,rw,rh,score:s,s2,rotated:r};};
  for(const f of this.free){if(w<=f.w&&h<=f.h)tr(f.x,f.y,w,h,f,false);if(rot&&h<=f.w&&w<=f.h)tr(f.x,f.y,h,w,f,true);}return best;}
 place(r){const nf=[];for(const f of this.free){if(r.x>=f.x+f.w||r.x+r.w<=f.x||r.y>=f.y+f.h||r.y+r.h<=f.y){nf.push(f);continue;}

  Object.entries(byD).sort((a,b)=>a[0]-b[0]).forEach(([d,arr],ti)=>{gc.push(`(SCULA T${ti+1} - burghiu D${d})`,`T${ti+1} M6`,'S6000 M3');arr.forEach(ph=>{gc.push(`G0 X${f3(ph.x)} Y${f3(ph.y)}`,`G1 Z${f3(-Math.min(ph.h.dep,g.th))} F1500`,'G0 Z25');});});

  gc.push('M5','G0 Z50','M30');
  files.push({name:`DXF/${base}.dxf`,data:dxf(ents)},{name:`GCODE/${base}.nc`,data:gc.join('\n')});});});
 files.push({name:'piese.csv',data:'﻿ID;Piesa;Corp;Lungime;Latime;Grosime;Material;Cant L1;Cant L2;Cant W1;Cant W2;Gauri\n'+P.parts.map(p=>[p.pid,p.name,p.cab,p.L,p.W,p.th,p.dec.n,p.edges.L1,p.edges.L2,p.edges.W1,p.edges.W2,p.holes.length].join(';')).join('\n')});
 files.push({name:'gauri.csv',data:'﻿ID piesa;Tip;Fata/Cant;X (pe lungime);Y (pe latime);Diametru;Adancime\n'+P.parts.flatMap(p=>p.holes.map(h=>[p.pid,h.k,h.side,String(h.u).replace('.',','),String(h.v).replace('.',','),h.d,Math.round(h.dep)].join(';'))).join('\n')});
 files.push({name:'CITESTE.txt',data:`GIM MOB Design - export CNC\nProiect: ${S.name}\nData: ${new Date().toLocaleString('ro-RO')}\n\nDXF/  - cate un fisier pe foaie: straturi FOAIE, CONTUR_<grosime>, GAURA_D<diametru>_A<adancime>, TEXT. Unitati: mm, origine colt stanga-jos.\nGCODE/ - program generic (gaurire + conturare). Verifica si adapteaza la postprocesorul masinii tale inainte de rulare!\npiese.csv - lista piese cu cant (1 = are cant).\ngauri.csv - toate gaurile: fata A/B = gauri pe fata, L1/L2/W1/W2 = gauri in cant (orizontale).\nImbinari: ${JOINS[S.std.join]}\n`});
 return makeZip(files);
}

 const sel=selId;selId=null;refreshOverlay();renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/jpeg',.92);selId=sel;refreshOverlay();
 modalState={shot:1};openModal(`${mhead('Captură','Salvează imaginea pentru client')}<img class="shot" src="${url}" alt="Randare proiect"><div style="height:10px"></div><button class="btn gold wide" id="shDl">Descarcă imaginea (JPG)</button>`,true);
 $('#shDl').onclick=async()=>{const bs=atob(url.split(',')[1]),u8=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u8[i]=bs.charCodeAt(i);const b=new Blob([u8],{type:'image/jpeg'});saveFile(`GIMMOB_${S.name.replace(/[^\w-]+/g,'_')}.jpg`,b);};
}

/* ================== BUCLĂ RANDARE ================== */
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);
const tmpV=new THREE.Vector3();
function loop(){
 requestAnimationFrame(loop);
 if(camAnim){camAnim.t=Math.min(1,camAnim.t+.06);const k=1-Math.pow(1-camAnim.t,3);camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(camAnim.t>=1)camAnim=null;}
 if(Math.abs(openT-openTarget)>.001){openT+=(openTarget-openT)*.12;if(Math.abs(openT-openTarget)<.002)openT=openTarget;S.items.forEach(i=>{if(i._open==null)applyOpen(i,openT);});}
 for(const h of handleVis){h.getWorldPosition(tmpV);h.scale.setScalar(camera.position.distanceTo(tmpV)*.013);}
 controls.update();renderer.render(scene,camera);
}
resize();buildRoom();S.items.forEach(rebuildItem);renderPanel();updateTop();setCam('3d',true);applyViewMode();loop();
window.__gmobReady=true;window.__gmob={S:()=>S,production,partsFor,holesFor,select,setTool,openRadial,chooseType,act,fillSpace,runChecks,nesting,allParts,buildCNC,drawingPages,labelPages,openProduction,openChecks,openScan,openStretch,openStd,openCtx};
function openWelcome(){
 modalState={welcome:1};
 openModal(`<div style="text-align:center;padding:6px 4px"><img src="${document.querySelector('.brand img').src}" style="width:120px;border-radius:10px;margin:4px auto 14px;display:block" alt="GIM MOB">
 <h2 style="font-size:26px;margin-bottom:10px">Bun venit în GIM MOB</h2>
 <div style="font-size:17px;line-height:1.5;margin:0 0 18px;color:#ece8e1">Confirmă că <b style="color:var(--gold)">Șerban</b> e cel mai șmecher fiu și că trebuie să îi dai <b style="color:var(--gold)">100 de lei</b> pe aplicație.</div>
 <button class="btn gold wide" id="wOk" style="font-size:16px;padding:14px">Confirm ✓</button></div>`);
 $('#wOk').onclick=()=>{LS.set('gimmob.welcome','1');closeModal(true);toast('Confirmat! Șerban așteaptă cei 100 de lei 😄');if(LS.get('gmob.help')!=='2')setTimeout(openHelp,900);};
}
setTimeout(()=>{$('#splash').classList.add('off');if(!LS.get('gimmob.welcome'))setTimeout(openWelcome,400);else if(LS.get('gmob.help')!=='2')setTimeout(openHelp,500);},700);
</script>
