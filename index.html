<meta name="application-name" content="GIMMOB Studio">
<meta name="apple-mobile-web-app-title" content="GIMMOB Studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#141414;--panel2:#1c1c1c;--line:#2a2a2a;--gold:#d8b46e;--gold2:#a77d3c;--txt:#ece8e1;--mut:#9a948a;--blue:#2f55ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:78px 1fr 344px;grid-template-rows:60px 1fr;grid-template-areas:"top top top" "tools view panel"}
#top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0a0a0a;border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:44px;border-radius:6px;display:block}
.brand b{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.14em;background:linear-gradient(180deg,#f3dca2,#b3843f);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.brand span{font-size:9.5px;letter-spacing:.45em;color:var(--mut);display:block;margin-top:2px}
.pname{flex:1;text-align:center;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname b{color:var(--txt);font-weight:600}
.tb{display:flex;gap:6px;margin-left:auto}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:active{transform:scale(.95)}
.ib svg{width:19px;height:19px}
.ib:disabled{opacity:.35}
#tools{grid-area:tools;background:#0a0a0a;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;z-index:6}
#tools button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:13px;font:500 10px Inter,sans-serif;cursor:pointer;white-space:nowrap}
#tools button svg{width:23px;height:23px}
#tools button.on{background:linear-gradient(180deg,#2b2417,#1a160e);color:var(--gold);box-shadow:inset 0 0 0 1px #4d3d20}
#tools button:hover{color:var(--txt)}
#view{grid-area:view;position:relative;overflow:hidden;background:#f1efea}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 28px;z-index:4}
.grab{display:none}
/* floating bars */
.fbar{position:absolute;display:flex;gap:4px;background:rgba(14,14,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2c2c2c;border-radius:14px;padding:4px;z-index:3}
.fbar button{border:0;background:none;color:#cfc9bf;font:600 12px Inter,sans-serif;padding:7px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}
.fbar button.on{background:linear-gradient(180deg,#e2c27f,#b68c48);color:#141007}
#viewbar{top:12px;right:12px}
.fbar[hidden]{display:none}
#ctx{position:fixed;z-index:70;background:#151515;border:1px solid #3a3020;border-radius:14px;padding:6px;min-width:230px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
#ctx[hidden]{display:none}
#ctx .ctxh{font:600 11px Inter;color:var(--gold);padding:6px 10px 8px;letter-spacing:.04em;border-bottom:1px solid #262626;margin-bottom:4px}

a{color:var(--gold)}

 x.font=`700 ${fs}px Inter,Arial`;x.fillStyle=opts.bg||'rgba(255,255,255,.95)';x.beginPath();x.roundRect?x.roundRect(1,1,w-2,h-2,14):x.rect(1,1,w-2,h-2);x.fill();x.strokeStyle=opts.stroke||'#c99a45';x.lineWidth=3;x.stroke();
 x.fillStyle=opts.color||'#1a1a1a';x.textBaseline='middle';x.fillText(text,15,h/2+2);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,sizeAttenuation:false}));const k=opts.k||.032;sp.scale.set(k*w/h,k,1);sp.renderOrder=1000;sp.raycast=()=>{};return sp;
}

function setNDC(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);}
function hitPlaneY(ymm){const v=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-ymm*MM),v)?v.multiplyScalar(1000):null;}
function pick(){const hs=ray.intersectObjects(itemsRoot.children,true);for(const h of hs){let o=h.object,vis=true;while(o&&!o.userData.id){if(o.visible===false)vis=false;o=o.parent;}if(o&&vis&&o.visible!==false)return o.userData.id;}return null;}
const snap10=v=>Math.round(v/10)*10;
function sameWallEnds(it){
 const E=[0,wallLen(it.wall)];
 for(const o of S.items){if(o===it)continue;const vOver=o.e<it.e+it.h&&o.e+o.h>it.e;
  if(o.wall===it.wall&&vOver&&Math.abs((o.off||0)-(it.off||0))<200)E.push(o.s-o.w/2,o.s+o.w/2);
  if(vOver&&o.wall==='back'&&(o.off||0)<50&&it.wall!=='back'){const p=placement(o);if(it.wall==='left'&&p.cx-o.w/2<it.d+50)E.push(o.d);if(it.wall==='right'&&p.cx+o.w/2>S.room.w-it.d-50)E.push(o.d);}
  if(vOver&&o.wall!=='back'&&it.wall==='back'&&(o.off||0)<50&&o.s-o.w/2<it.d+50){if(o.wall==='left')E.push(o.d);if(o.wall==='right')E.push(S.room.w-o.d);}
 }return E;}
function snapS(it,s){let best=null,bd=45;const L=s-it.w/2,R=s+it.w/2;for(const e of sameWallEnds(it)){if(Math.abs(e-L)<bd){bd=Math.abs(e-L);best=e+it.w/2;}if(Math.abs(e-R)<bd){bd=Math.abs(e-R);best=e-it.w/2;}}return best!=null?best:snap10(s);}
function snapEdge(it,v){let best=null,bd=45;for(const e of sameWallEnds(it)){if(Math.abs(e-v)<bd){bd=Math.abs(e-v);best=e;}}return best!=null?best:snap10(v);}

  const p=hitPlaneY(it.e+it.h/2);if(!p)return;const ds=sigma(it)*(p.dot(axisOf(it))-drag.a0);const prevS=it.s,Lw=wallLen(it.wall);let ns=snapS(it,drag.s0+ds);if(it.w<=Lw)ns=Math.max(it.w/2,Math.min(Lw-it.w/2,ns));it.s=ns;if(!okPlace(it))it.s=prevS;const g=groups.get(it.id);g&&applyPlacement(it,g);selRoot.children[0]&&applyPlacement(it,selRoot.children[0]);}
 else if(drag.k==='resize'){
  if(drag.h==='T'){const pc=placement(it);const n=new THREE.Vector3(Math.sin(pc.rot),0,Math.cos(pc.rot));const pt=new THREE.Vector3(pc.cx*MM,0,pc.cz*MM).addScaledVector(n,it.d/2*MM);const v=new THREE.Vector3();if(!ray.ray.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(n,pt),v))return;const ph=it.h;it.h=Math.max(30,Math.min(S.room.h-it.e,snap10(v.y*1000-it.e)));if(!okPlace(it))it.h=ph;}
  else{const p=hitPlaneY(it.e+it.h/2);if(!p)return;const sv=Math.max(0,Math.min(wallLen(it.wall),sigma(it)*p.dot(axisOf(it))));const pw=it.w,ps=it.s;

function rectFromDrag(d){
 const R=S.room,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 let x0=Math.min(d.p0.x,d.p1.x),x1=Math.max(d.p0.x,d.p1.x),z0=Math.min(d.p0.z,d.p1.z),z1=Math.max(d.p0.z,d.p1.z);
 x0=snap10(cl(x0,0,R.w));x1=snap10(cl(x1,0,R.w));z0=snap10(cl(z0,0,R.d));z1=snap10(cl(z1,0,R.d));
 if(x1-x0<60&&z1-z0<60){x0=Math.max(0,x0-300);x1=x0+600;z0=0;z1=PRESETS[drawPre].d;}
 return{x0,x1,z0,z1};
}
function spaceFromDrag(d){
 const R=S.room,pre=PRESETS[drawPre];let{x0,x1,z0,z1}=rectFromDrag(d);
 const dl=R.left?x0:1e9,dr=R.right?R.w-x1:1e9,db=z0,m=Math.min(db,dl,dr);
 if(m===db||m>400){const w=Math.max(100,x1-x0),dep=Math.max(100,z1-z0<150?pre.d:z1-z0);return makeSpace({wall:'back',w,d:dep,s:x0+w/2,h:pre.h,e:pre.e,off:m>400?Math.max(0,z0):0});}
 const w=Math.max(100,z1-z0),dep=Math.max(100,x1-x0<150?pre.d:x1-x0);
 return makeSpace({wall:m===dl?'left':'right',w,d:dep,s:z0+w/2,h:pre.h,e:pre.e});
}

function mutate(fn){const b=ser();fn();const a=ser();if(a!==b){undoS.push(b);if(undoS.length>100)undoS.shift();redoS=[];flags={};autosave(a);}}
function load(str,silent){S=JSON.parse(str);fixState();if(!S.items.find(i=>i.id===selId))selId=null;flags={};rebuildAll();if(!silent)autosave();}

const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',QRLIB='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';

addEventListener('keydown',e=>{
 const k=e.key,lk=k.toLowerCase(),mod=e.ctrlKey||e.metaKey;
 if(e.target.matches('input,textarea,select')){
  if(k==='Enter'&&modalState&&modalState.sp&&e.target.dataset.rcode!=null){e.preventDefault();e.target.blur();}
  return;}
 if(mod&&lk==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(mod&&lk==='y'){e.preventDefault();redo();return;}
 if(mod&&lk==='s'){e.preventDefault();autosave();toast('Salvat');return;}
 if(mod&&lk==='d'){e.preventDefault();act('dup');return;}
 if(mod||e.altKey)return;
 const modalOpen=!$('#modal').hidden,radOpen=!$('#radial').hidden;
 if(k==='Escape'){if(drag)cancelDrag();closeRadial();closeModal();closeCtx();select(null);setTool('select');return;}

 if(/^Arrow/.test(k)&&it){e.preventDefault();nudge(it,k,e.shiftKey?100:10);return;}
 if((k==='PageUp'||k==='PageDown')&&it){e.preventDefault();nudge(it,k,e.shiftKey?100:10);return;}
 if(/^[0-9.,]$/.test(k)&&it&&!isMobile()){const I=$('#vcbI');I.value='';I.focus();return;}
 const map={b:()=>setTool(tool==='draw'?'select':'draw'),' ':()=>setTool('select'),c:()=>$('#tCat').click(),x:()=>$('#tView').click(),
  o:()=>$('#tOpen').click(),p:()=>$('#tProd').click(),r:()=>$('#tRoom').click(),h:()=>openHelp(),'?':()=>openHelp(),f1:()=>openHelp(),
  1:()=>camKey('3d'),2:()=>camKey('top'),3:()=>camKey('front'),4:()=>$('#bDims').click(),z:()=>camKey('3d'),
  d:()=>act('dup'),m:()=>it&&act('flip'),f:()=>it&&it.kind==='space'&&act('fill'),s:()=>it&&it.kind==='space'&&act('split'),
  v:()=>it&&it.kind==='space'&&openVSplit(it),t:()=>it&&act('stretch')};
 const fn=map[lk];if(fn){e.preventDefault();fn();}
});
function camKey(c){const b=document.querySelector(`#viewbar [data-cam="${c}"]`);b?b.click():setCam(c);}
function nudge(it,k,step){
 const before=ser();
 if(k==='ArrowLeft'||k==='ArrowRight'){const cr=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),al=cr.dot(axisOf(it));
  const dir=(k==='ArrowRight'?1:-1)*(al<0?-1:1)*sigma(it),Lw=wallLen(it.wall),ns=it.s+dir*step;it.s=it.w<=Lw?Math.max(it.w/2,Math.min(Lw-it.w/2,ns)):ns;}
 else{it.e=Math.max(0,Math.min(S.room.h-it.h,it.e+((k==='ArrowUp'||k==='PageUp')?step:-step)));}
 if(!okPlace(it)){S=JSON.parse(before);fixState();rebuildAll();toast('Nu se poate muta acolo');return;}
 const after=ser();if(after!==before){undoS.push(before);if(undoS.length>100)undoS.shift();redoS=[];flags={};autosave(after);}

}

function openVSplit(sp){
 if(!sp||sp.kind!=='space')return;
 modalState={vsplit:sp};
 openModal(`${mhead('Împarte pe înălțime',Math.round(sp.h)+' mm înălțime · de jos în sus')}
 <label class="fld"><span>Număr de nivele egale</span><input type="number" inputmode="numeric" id="vsN" value="2"><i>buc</i></label>
 <div class="lab" style="margin:10px 0 4px">sau înălțimi exacte de jos în sus, separate prin virgulă</div><input class="inp" id="vsH" placeholder="ex: 858, 600"><div style="height:12px"></div><button class="btn gold wide" id="vsGo">Împarte</button>`);
 $('#vsGo').onclick=()=>{let hs=$('#vsH').value.split(/[,; ]+/).map(Number).filter(v=>v>0);
  if(hs.length){const sum=hs.reduce((a,b)=>a+b,0);if(sum>sp.h+1){toast('Suma înălțimilor depășește spațiul');return;}if(sp.h-sum>=30)hs.push(sp.h-sum);else hs[hs.length-1]+=sp.h-sum;}
  else{const n=Math.max(1,Math.min(10,+$('#vsN').value||1)),b=Math.floor(sp.h/n);hs=Array(n).fill(b);hs[n-1]=sp.h-b*(n-1);}
  if(hs.some(h=>h<30)){toast('Nivel prea mic (minim 30 mm)');return;}
  const made=[];mutate(()=>{S.items=S.items.filter(i=>i!==sp);let y=sp.e;for(const h of hs){const c=makeSpace({wall:sp.wall,off:sp.off||0,w:sp.w,h,d:sp.d,e:y,s:sp.s});made.push(c);y+=h;}S.items.push(...made);});
  closeModal();removeGroup(sp.id);made.forEach(rebuildItem);select(made[0].id);toast(`Împărțit în ${made.length} nivele`);};
}

 if(i.dataset.newc||i.dataset.neww){const k=i.dataset.newc||i.dataset.neww,box=i.closest('.sec')||document;const col=box.querySelector(`[data-newc="${k}"]`),wd=box.querySelector(`[data-neww="${k}"]`);const c=col&&col.dataset.code;if(!c)return;
  mutate(()=>{S.custom[c]={h:col.value,k:wd&&wd.checked?1:0};});fillEggList();for(const kk in matCache)if(kk.startsWith('d_'+c+'_'))delete matCache[kk];for(const ic in iconCache)delete iconCache[ic];rebuildAll();toast('Culoare salvată pentru codul '+c);return;}

function fillEggList(){const dl=$('#eggList');if(dl)dl.innerHTML=[...EGGER.map(([c,n])=>`<option value="${c}">${c} ${n}</option>`),...Object.keys(S.custom||{}).map(c=>`<option value="${c}">${c} (cod propriu)</option>`)].join('');}
function inRoom(it){const b=bbox(it),Rm=S.room;return b.x0>=-1&&b.x1<=Rm.w+1&&b.z0>=-1&&b.z1<=Rm.d+1&&b.y1<=Rm.h+1;}
function ovl(it){if(!it||it.kind!=='cab'||it.hidden)return[];const a=bbox(it);return S.items.filter(o=>o!==it&&o.kind==='cab'&&!o.hidden&&(()=>{const b=bbox(o);return a.x0<b.x1-2&&a.x1>b.x0+2&&a.z0<b.z1-2&&a.z1>b.z0+2&&a.y0<b.y1-2&&a.y1>b.y0+2;})());}
const okPlace=it=>it.kind!=='cab'?inRoom(it):(inRoom(it)&&!ovl(it).length);
function revertTo(before,msg){S=JSON.parse(before);fixState();if(undoS[undoS.length-1]===before)undoS.pop();rebuildAll();autosave();toast(msg);}
function setKey(k,v){
 let full=false;const before=ser(),selBefore=getSel();
 if(selBefore&&/^(w|h|d|e|off|from)$/.test(k)&&(String(v).trim()===''||!isFinite(+v)||+v<0)){renderPanel();return;}
 mutate(()=>{
  if(k==='all.handle'){S.items.forEach(i=>{if(i.kind==='cab'&&i.o)i.o.handle=v;});full=true;toast('Mânere aplicate pe tot proiectul');}
  else if(k==='all.hside'){S.items.forEach(i=>{if(i.kind==='cab'&&i.o)i.o.hinge=v;});full=true;toast(v==='auto'?'Mânere automate: se pun spre partea opusă colțului':v==='R'?'Toate mânerele pe stânga':'Toate mânerele pe dreapta');}
  else if(/^(room|mat|rates|std)\./.test(k)){const[a,b]=k.split('.');const cur=S[a][b];S[a][b]=typeof cur==='boolean'?v==='1':typeof cur==='number'?Math.max(a==='room'?500:0,+v||0):(a==='mat'?(normCode(v)||cur):v);full=true;
   if(k==='room.left'&&!S.room.left)S.items.forEach(i=>{if(i.wall==='left')i.wall='back';});if(k==='room.right'&&!S.room.right)S.items.forEach(i=>{if(i.wall==='right')i.wall='back';});}
  else if(k==='name')S.name=v||'Proiect';
  else{const it=getSel();if(!it)return;
   if(k.startsWith('o.')){const kk=k.slice(2);if(kk==='gap')it.o.gap=v===''?null:Math.max(0,+v);else if(kk==='horient')it.o.horient=v||null;else it.o[kk]=(v===''||isNaN(+v))?v:+v;}
   else if(k==='from')it.s=(+v||0)+it.w/2;
   else if(k==='w'){const l=it.s-it.w/2;it.w=Math.max(10,+v||10);it.s=l+it.w/2;}
   else if(k==='wall'){it.wall=v;it.s=Math.max(it.w/2,Math.min(it.s,wallLen(v)-it.w/2));}
   else if(k==='mb'||k==='mf')it[k]=v?normCode(v):null;
   else it[k]=Math.max(k==='e'||k==='off'?0:10,+v||0);
  }
 });
 if(/^room\./.test(k)&&S.items.some(i=>!inRoom(i)||ovl(i).length)&&ser()!==before){revertTo(before,'Mobila nu mai încape în camera mai mică — mut-o sau șterge ceva întâi');return;}
 if(selBefore&&!/^(all|room|mat|rates|std|name)/.test(k)){const it=getSel();if(it&&!okPlace(it)&&ser()!==before){revertTo(before,inRoom(it)?'Nu încape — e alt corp în cale. Mută-l întâi.':'Nu încape — ar ieși din cameră.');return;}}
 if(full){if(/^std\./.test(k))for(const c in iconCache)delete iconCache[c];rebuildAll();}else{const it=getSel();it&&rebuildItem(it);refreshOverlay();renderPanel();}
 if(modalState&&modalState.std)openStd();
}
function act(a){
 const it=getSel();closeCtx();
 if(a==='closep'){$('#panel').classList.remove('open');return;}
 if(a==='desel'){select(null);return;}
 if(a==='newcab'){openRadial('new');return;}
 if(a==='scan'){openScan();return;}
 if(a==='std'){openStd();return;}
 if(a==='showall'){mutate(()=>S.items.forEach(i=>delete i.hidden));S.items.forEach(rebuildItem);renderPanel();return;}
 if(!it)return;
 if(a==='delete'){mutate(()=>{S.items=S.items.filter(i=>i!==it);});removeGroup(it.id);select(null);toast('Șters');}
 else if(a==='dup'){let c;mutate(()=>{c=JSON.parse(JSON.stringify(it,(k,v)=>k[0]==='_'?undefined:v));c.id=nid();c.s=it.s+it.w;S.items.push(c);if(!okPlace(c)){c.s=it.s-it.w;if(!okPlace(c)){S.items.pop();c=null;}}});if(!c){toast('Nu e loc pentru copie lângă el');return;}rebuildItem(c);select(c.id);toast('Duplicat');}
 else if(a==='change'||a==='convert')openRadial(it.kind==='space'?'space':'change');
 else if(a==='fill')fillSpace(it);
 else if(a==='split')openSplit(it);
 else if(a==='hide'){mutate(()=>{it.hidden=true;});rebuildItem(it);select(null);toast('Ascuns · îl găsești în Cameră → Arată ascunse');}
 else if(a==='flip'){if(it.o){mutate(()=>{it.o.hinge=hingeOf(it)==='L'?'R':'L';it.o.bside=it.o.bside==='L'?'R':'L';});rebuildItem(it);renderPanel();}}
 else if(a==='openone'){it._open=it._open?0:1;applyOpen(it,it._open);}
 else if(a==='stretch')openStretch(it);
 else if(a==='prodone')openProduction(it.id);
}

const iconCache={};
function typeIcon(type){
 if(iconCache[type])return iconCache[type];
 const it=makeCab(type);const W=it.w,H=it.h,sc=40/Math.max(W,H,1),ox=24-W*sc/2,oy=24+H*sc/2;
 const ord={back:0,body:1,leg:1,counter:1,oven:2,front:3,glass:4,groove:4,metal:5};
 const fill={front:'#e3cfa8',metal:'#222',counter:'#a9a39a',oven:'#333',glass:'#111',leg:'#222',body:'#fff',groove:'#5a4a3a'};
 let s='<svg viewBox="0 0 48 48">';
 partsFor(it).filter(p=>p.mat!=='back'&&!/^Sertar /.test(p.name)&&p.name!=='Soclu spate').sort((a,b)=>(ord[a.mat]??1)-(ord[b.mat]??1)).forEach(p=>{
  const x=ox+(p.x0+W/2)*sc,y=oy-p.y1*sc,w=Math.max(.8,(p.x1-p.x0)*sc),h=Math.max(.8,(p.y1-p.y0)*sc);
  s+=`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="${fill[p.mat]||'#fff'}" stroke="#4a4a4a" stroke-width=".45"/>`;});
 return iconCache[type]=s+'</svg>';
}
let radialCtx=null,radialPick=null;
function openRadial(ctx){
 radialCtx=ctx;radialPick=null;const R=$('#radial'),mob=isMobile();const Sz=Math.max(300,Math.min(innerWidth-12,innerHeight-170,660));
 const keys=Object.keys(TYPES),r1=keys.filter(k=>TYPES[k].cat==='base'),r2=keys.filter(k=>/wall|tall/.test(TYPES[k].cat)),r3=keys.filter(k=>/ward|panel|decor/.test(TYPES[k].cat));
 const sub={new:'Alege un corp nou',space:'Alege corpul pentru spațiul albastru',change:'Schimbă tipul corpului'}[ctx];
 let h=`<button class="ib rclose" data-close="1">${IC.x}</button><div class="rwrap ${mob?'mob':''}" style="width:${Sz}px;height:${Sz}px"><div class="rcenter"><b>Box Tool</b><span id="rlab">${sub}</span><button class="btn gold" id="rgo" hidden>Alege</button></div>`;
 const place=(arr,r,off)=>arr.forEach((k,i)=>{const a=-Math.PI/2+off+i*2*Math.PI/arr.length,x=Sz/2+Math.cos(a)*r,y=Sz/2+Math.sin(a)*r;h+=`<button class="rb" data-type="${k}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;--c:${CATS[TYPES[k].cat].c}">${typeIcon(k)}<em>${TYPES[k].n}</em></button>`;});
 const k3=mob?.425:.455,k2=mob?.31:.33,k1=mob?.19:.2;place(r1,Sz*k1,Math.PI/r1.length);place(r2,Sz*k2,0);place(r3,Sz*k3,Math.PI/r3.length);
 h+=`</div><div class="rleg">${Object.values(CATS).map(c=>`<span><i style="background:${c.c}"></i>${c.n}</span>`).join('')}</div>`;
 R.innerHTML=h;R.hidden=false;
}

function chooseType(type){
 const it=getSel(),t=TYPES[type];
 if(radialCtx==='space'&&it&&it.kind==='space'){openReplace(it,type);return;}
 if(radialCtx==='change'&&it&&it.kind==='cab'){
  mutate(()=>{const old=TYPES[it.type],left=it.s-it.w/2;if(old.cat!==t.cat){it.w=t.w;it.h=t.h;it.d=t.d;it.e=t.e;}const keep={hinge:it.o.hinge||'auto',handle:it.o.handle};it.type=type;it.o=Object.assign(defOpts(type),keep);it.s=left+it.w/2;});
  if(!okPlace(it)){revertTo(undoS[undoS.length-1],'Noul tip nu încape aici — mută corpul întâi');return;}
  rebuildItem(it);refreshOverlay();renderPanel();toast('Tip schimbat: '+t.n);return;}
 const c=makeCab(type);
 const busy=S.items.filter(o=>o.wall==='back'&&(o.off||0)<50&&o.e<c.e+c.h&&o.e+o.h>c.e).map(o=>[o.s-o.w/2,o.s+o.w/2]).sort((a,b)=>a[0]-b[0]);
 let ok=false;const walls=['back',...(S.room.left?['left']:[]),...(S.room.right?['right']:[])];
 for(const w of walls){if(ok)break;c.wall=w;const Lw=wallLen(w);for(let x=c.w/2;x<=Lw-c.w/2+1;x+=10){c.s=x;if(okPlace(c)){ok=true;break;}}}
 if(!ok){toast('Nu mai e loc liber pe pereți — mărește camera sau mută ceva');return;}
 mutate(()=>S.items.push(c));rebuildItem(c);select(c.id);toast('Adăugat: '+t.n+' · trage-l ca să-l muți');

function doReplace(){

 if(m.mode==='code'&&!pl.src){toast('Cod negăsit');return;}
 const ib=Math.max(0,Math.min(m.ib,sp.h-30)),idp=Math.max(0,Math.min(m.id,sp.d-30));

function guessCat(sp){if(sp.e>=1000)return'wall';if(sp.h<=1150)return'base';if(sp.h>=2250&&sp.d>=520)return'ward';return sp.d<450?'ward':'tall';}
function fillPlan(sp){

 let n=Math.max(1,Math.round(sp.w/target)),mw=Math.floor(sp.w/n);while(n>1&&mw<300){n--;mw=Math.floor(sp.w/n);}
 const pick=(i,w)=>cat==='base'?(i===0?'base_drawer3':(i===1&&n>2?'base_sink':(w>=700?'base_door2':'base_door1'))):cat==='wall'?(w>=700?'wall_door2':'wall_door1'):cat==='tall'?'tall_door':(sp.d<450?'shelf_unit':(w>=1300?'ward3':'ward2'));

 for(let i=0;i<n;i++){const w=i<n-1?mw:sp.w-mw*(n-1);out.push(makeCab(pick(i,w),{wall:sp.wall,off:sp.off||0,w,h:sp.h-cH,d:isBase?sp.d-20:sp.d,e:sp.e,s:x+w/2}));x+=w;}

}

function runOf(it){

 const list=S.items.filter(band).sort((a,b)=>a.s-b.s);let i=list.indexOf(it);if(i<0)return{run:[it],L:it.s-it.w/2,R:it.s+it.w/2,counters:[]};let lo=i,hi=i;
 while(lo>0&&Math.abs((list[lo-1].s+list[lo-1].w/2)-(list[lo].s-list[lo].w/2))<6)lo--;
 while(hi<list.length-1&&Math.abs((list[hi].s+list[hi].w/2)-(list[hi+1].s-list[hi+1].w/2))<6)hi++;
 const run=list.slice(lo,hi+1),L=run[0].s-run[0].w/2,R=run[run.length-1].s+run[run.length-1].w/2;
 const counters=S.items.filter(o=>o.type==='counter'&&o.wall===it.wall&&o.s-o.w/2>=L-30&&o.s+o.w/2<=R+30&&Math.abs(o.e-(Math.max(...run.map(r=>r.e+r.h))))<60);

}

function wallGaps(wall,y0,y1){
 const L=wallLen(wall),occ=[];
 for(const o of S.items){if(o.hidden)continue;const vOver=o.e<y1&&o.e+o.h>y0;if(!vOver)continue;
  if(o.wall===wall&&(o.off||0)<100)occ.push([o.s-o.w/2,o.s+o.w/2]);
  else if((o.off||0)<100){const p=placement(o);
   if(wall==='back'&&o.wall==='left'&&o.s-o.w/2<620)occ.push([0,o.d]);if(wall==='back'&&o.wall==='right'&&o.s-o.w/2<620)occ.push([S.room.w-o.d,S.room.w]);
   if(wall==='left'&&o.wall==='back'&&p.cx-o.w/2<300)occ.push([0,o.d]);if(wall==='right'&&o.wall==='back'&&p.cx+o.w/2>S.room.w-300)occ.push([0,o.d]);}}
 occ.sort((a,b)=>a[0]-b[0]);const gaps=[];let x=0;for(const[a,b]of occ){if(a>x)gaps.push([x,a]);x=Math.max(x,b);}if(x<L)gaps.push([x,L]);

}

   if(w<300&&auto){const ty=f.band==='base'?'base_open':'wall_open',t=TYPES[ty];made.push(makeCab(ty,{wall:f.w,w,h:f.band==='base'?820:t.h,d:f.band==='base'?580:t.d,e:f.band==='base'?0:t.e,s:a+w/2}));if(f.band==='base')made.push(makeCab('counter',{wall:f.w,w,h:38,d:600,e:820,s:a+w/2}));return;}
   const sp=makeSpace({wall:f.w,w,h:pre.h,d:pre.d,e:pre.e,s:a+w/2});if(auto)made.push(...fillPlan(sp));else made.push(sp);});

/* ---- Verificare înainte de producție ---- */
function bbox(it){const p=placement(it),along=it.w/2,perp=it.d/2;return it.wall==='back'?{x0:p.cx-along,x1:p.cx+along,z0:p.cz-perp,z1:p.cz+perp,y0:it.e,y1:it.e+it.h}:{x0:p.cx-perp,x1:p.cx+perp,z0:p.cz-along,z1:p.cz+along,y0:it.e,y1:it.e+it.h};}
function runChecks(){
 const out=[],R=S.room,cabs=S.items.filter(i=>i.kind==='cab'&&!i.hidden),bx=new Map(cabs.map(c=>[c,bbox(c)]));
 const ov=(a,b,t=2)=>a.x0<b.x1-t&&a.x1>b.x0+t&&a.z0<b.z1-t&&a.z1>b.z0+t&&a.y0<b.y1-t&&a.y1>b.y0+t;
 for(let i=0;i<cabs.length;i++)for(let j=i+1;j<cabs.length;j++)if(ov(bx.get(cabs[i]),bx.get(cabs[j])))out.push({lvl:'err',id:cabs[i].id,msg:`${cabCode(cabs[i])} se suprapune cu ${cabCode(cabs[j])}`});
 for(const c of cabs){const b=bx.get(c),t=TYPES[c.type],nm=cabCode(c);
  if(b.x0<-1||b.x1>R.w+1||b.z0<-1||b.z1>R.d+1||b.y1>R.h+1)out.push({lvl:'err',id:c.id,msg:`${nm} iese din cameră`});
  if(t.cat==='panel'||t.cat==='decor')continue;
  const parts=partsFor(c);
  for(const p of parts){const w=p.x1-p.x0,h=p.y1-p.y0;
   if(p.role==='door'&&w>620)out.push({lvl:'warn',id:c.id,msg:`${nm}: ușă lată de ${Math.round(w)} mm (peste 600 se poate lăsa)`});
   if(p.role==='door'&&h>2350)out.push({lvl:'warn',id:c.id,msg:`${nm}: ușă înaltă ${Math.round(h)} mm — folosește 5 balamale sau profil anti-curbare`});
   if(p.role==='dfront'&&w>1200)out.push({lvl:'warn',id:c.id,msg:`${nm}: sertar de ${Math.round(w)} mm — glisierele standard nu țin`});
   if(p.role==='shelf'&&w>900)out.push({lvl:'warn',id:c.id,msg:`${nm}: poliță de ${Math.round(w)} mm se poate curba — adaugă o diviziune`});}
  if(parts.some(p=>p.role==='dfront')){if(c.d<300)out.push({lvl:'err',id:c.id,msg:`${nm}: prea puțin adânc pentru glisiere (${c.d} mm)`});if(c.w<250)out.push({lvl:'err',id:c.id,msg:`${nm}: prea îngust pentru sertare`});}
  if(c.o&&c.o.handle==='none'&&parts.some(p=>p.role==='door'||p.role==='dfront'))out.push({lvl:'info',id:c.id,msg:`${nm}: fără mâner — adaugă sistem push-to-open`});
  if(t.cat==='wall'){for(const b2 of cabs){if(TYPES[b2.type].cat!=='base'&&b2.type!=='counter')continue;const A=bx.get(c),Bb=bx.get(b2);if(A.x0<Bb.x1&&A.x1>Bb.x0&&A.z0<Bb.z1&&A.z1>Bb.z0){const gap=A.y0-Bb.y1;if(gap>=0&&gap<450){out.push({lvl:'warn',id:c.id,msg:`${nm}: doar ${Math.round(gap)} mm între blat și corpul suspendat`});break;}}}}
  if(t.cat==='base'&&c.e<50){const top=c.e+c.h;const b=bx.get(c);const cov=cabs.some(o=>o.type==='counter'&&Math.abs(o.e-top)<15&&bx.get(o).x0<=b.x0+5&&bx.get(o).x1>=b.x1-5&&bx.get(o).z0<=b.z0+5&&bx.get(o).z1>=b.z1-5);if(!cov&&!t.sink&&c.h<900)out.push({lvl:'info',id:c.id,msg:`${nm}: fără blat deasupra`});}
 }
 S.items.filter(i=>i.kind==='space').forEach(s=>out.push({lvl:'info',id:s.id,msg:`Spațiu albastru netransformat (${Math.round(s.w)} mm)`}));
 return out;
}

/* ================== PRODUCȚIE ================== */
function axesOf(p){const e={x:p.x1-p.x0,y:p.y1-p.y0,z:p.z1-p.z0};const ax=['x','y','z'].sort((a,b)=>e[b]-e[a]);return{A:ax[0],B:ax[1],C:ax[2],e};}
function allParts(filterId){
 const out=[];let ci=0;
 for(const it of S.items){if(it.kind!=='cab')continue;ci++;if(filterId&&it.id!==filterId)continue;const code='C'+ci;
  S._curItem=it;const parts=partsFor(it),holes=holesFor(parts);S._curItem=null;let k=0;
  parts.forEach((p,pi)=>{if(!p.cut)return;k++;const{A,B,C,e}=axesOf(p);const L=Math.round(e[A]),W=Math.round(e[B]),th=Math.round(e[C]);const dec=decorOf(p,it);
   let edges={L1:0,L2:0,W1:0,W2:0};const allE=p.mat==='front'&&p.cant>0;
   if(allE)edges={L1:1,L2:1,W1:1,W2:1};else if(p.cant>0&&p.mat!=='back'){if(p.cn===B)edges.L1=1;else if(p.cn===A)edges.W1=1;}
   const cantMM=(edges.L1+edges.L2)*L+(edges.W1+edges.W2)*W;
   const hs=holes.filter(h=>h.pi===pi).map(h=>{const face=h.ax===C;const u=h[A]-p[A+'0'],v=h[B]-p[B+'0'];return{face,u:Math.round(u*10)/10,v:Math.round(v*10)/10,d:h.d,dep:h.dep,k:h.k,side:face?(h.sg>0?'B':'A'):(h.ax===A?(h.sg>0?'L2':'L1')+'':(h.sg>0?'W2':'W1'))};});
   out.push({pid:`${code}-${k}`,code,cab:TYPES[it.type].n,item:it,name:p.name,L,W,th,dec,mat:p.mat,edges,cantMM,grain:!!dec.wood,holes:hs,thin:p.mat==='front'?'2 mm':'0.4 mm'});});
  // feronerie
  parts.forEach(p=>{if(p.name==='Mâner')out.push({hw:'man',item:it});if(p.name==='Picior')out.push({hw:'pic',item:it});if(p.name==='Bară umeraș')out.push({hw:'bara',item:it});
   if(p.role==='door'){const fh=p.y1-p.y0,n=(+it.o.hinges)||(fh<=900?2:fh<=1600?3:fh<=2200?4:5);for(let i=0;i<n;i++)out.push({hw:'bal',item:it});}
   if(p.role==='dfront')out.push({hw:'glis',item:it});if(p.role==='lift')out.push({hw:'rab',item:it});});
 }
 return out;
}
function production(filterId){
 const all=allParts(filterId),parts=all.filter(p=>!p.hw),acc={bal:0,glis:0,man:0,pic:0,rab:0,bara:0};all.filter(p=>p.hw).forEach(p=>acc[p.hw]++);

 for(const p of parts){const key=[p.name,p.L,p.W,p.th,p.dec.id].join('|');if(!rows[key])rows[key]={...p,qty:0,ids:[]};rows[key].qty++;rows[key].ids.push(p.pid);

/* ---- optimizare plăci (MaxRects) ---- */
class Bin{constructor(W,H){this.W=W;this.H=H;this.free=[{x:0,y:0,w:W,h:H}];this.used=[];}
 find(w,h,rot){let best=null;const tr=(x,y,rw,rh,f,r)=>{const s=Math.min(f.w-rw,f.h-rh),s2=Math.max(f.w-rw,f.h-rh);if(!best||s<best.score||(s===best.score&&s2<best.s2))best={x,y,rw,rh,score:s,s2,rotated:r};};
  for(const f of this.free){if(w<=f.w&&h<=f.h)tr(f.x,f.y,w,h,f,false);if(rot&&h<=f.w&&w<=f.h)tr(f.x,f.y,h,w,f,true);}return best;}
 place(r){const nf=[];for(const f of this.free){if(r.x>=f.x+f.w||r.x+r.w<=f.x||r.y>=f.y+f.h||r.y+r.h<=f.y){nf.push(f);continue;}
   if(r.x>f.x)nf.push({x:f.x,y:f.y,w:r.x-f.x,h:f.h});if(r.x+r.w<f.x+f.w)nf.push({x:r.x+r.w,y:f.y,w:f.x+f.w-r.x-r.w,h:f.h});
   if(r.y>f.y)nf.push({x:f.x,y:f.y,w:f.w,h:r.y-f.y});if(r.y+r.h<f.y+f.h)nf.push({x:f.x,y:r.y+r.h,w:f.w,h:f.y+f.h-r.y-r.h});}
  const keep=[];for(let i=0;i<nf.length;i++){const a=nf[i];let cont=false;for(let j=0;j<nf.length;j++){if(i===j)continue;const b=nf[j];if(a.x>=b.x&&a.y>=b.y&&a.x+a.w<=b.x+b.w&&a.y+a.h<=b.y+b.h){const same=a.x===b.x&&a.y===b.y&&a.w===b.w&&a.h===b.h;if(!same||j<i){cont=true;break;}}}if(!cont)keep.push(a);}
  this.free=keep;}}
function nesting(parts){
 const st=S.std,groups={};
 for(const p of parts){const kind=p.mat==='back'?'hdf':p.mat==='counter'?'blat':'pal';const key=kind+'|'+p.dec.id+'|'+p.th;(groups[key]=groups[key]||{kind,dec:p.dec,th:p.th,parts:[]}).parts.push(p);}
 const res=[];
 for(const g of Object.values(groups)){
  const SL=g.kind==='blat'?st.blatL:st.sheetL,SW=g.kind==='blat'?st.blatW:st.sheetW,k=g.kind==='blat'?0:st.kerf,tr=g.kind==='blat'?0:st.trim,UW=SL-2*tr+k,UH=SW-2*tr+k;
  const items=g.parts.map(p=>({w:p.L,h:p.W,rot:!(p.grain&&g.kind==='pal')&&g.kind!=='blat',p})).sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h);
  const bins=[],over=[];
  for(const it of items){const w=it.w+k,h=it.h+k;let best=null;
   for(const b of bins){const r=b.find(w,h,it.rot);if(r&&(!best||r.score<best.score))best={...r,b};}
   if(!best){const b=new Bin(UW,UH);let r=b.find(w,h,it.rot);if(!r)r=b.find(w,h,true);if(!r){over.push(it.p);continue;}bins.push(b);best={...r,b};}
   best.b.place({x:best.x,y:best.y,w:best.rw,h:best.rh});best.b.used.push({x:best.x+tr,y:best.y+tr,w:best.rw-k,h:best.rh-k,rot:best.rotated,p:it.p});}
  const sheets=bins.map(b=>{const used=b.used.reduce((s,u)=>s+u.w*u.h,0);return{L:SL,W:SW,parts:b.used,yield:used/(SL*SW)};});
  res.push({...g,sheets,over,SL,SW});
 }
 res.sort((a,b)=>({pal:0,hdf:1,blat:2}[a.kind]-{pal:0,hdf:1,blat:2}[b.kind])||b.th-a.th);
 return{groups:res,total:res.reduce((s,g)=>s+g.sheets.length,0)};
}

function dxf(ents){let s='0\nSECTION\n2\nHEADER\n9\n$INSUNITS\n70\n4\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n';
 for(const e of ents){if(e.t==='L')s+=`0\nLINE\n8\n${e.l}\n10\n${f3(e.x1)}\n20\n${f3(e.y1)}\n30\n0\n11\n${f3(e.x2)}\n21\n${f3(e.y2)}\n31\n0\n`;else if(e.t==='C')s+=`0\nCIRCLE\n8\n${e.l}\n10\n${f3(e.x)}\n20\n${f3(e.y)}\n30\n0\n40\n${f3(e.r)}\n`;else if(e.t==='T')s+=`0\nTEXT\n8\n${e.l}\n10\n${f3(e.x)}\n20\n${f3(e.y)}\n30\n0\n40\n${f3(e.h)}\n1\n${e.s}\n`;}

const rect=(x,y,w,h,l)=>[{t:'L',l,x1:x,y1:y,x2:x+w,y2:y},{t:'L',l,x1:x+w,y1:y,x2:x+w,y2:y+h},{t:'L',l,x1:x+w,y1:y+h,x2:x,y2:y+h},{t:'L',l,x1:x,y1:y+h,x2:x,y2:y}];

function buildCNC(P){
 const files=[],ascii=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\- ]/g,'_');
 P.nest.groups.forEach(g=>{g.sheets.forEach((sh,i)=>{const base=ascii(`${g.dec.n}_${g.th}mm_foaia${i+1}`).replace(/ /g,'_');const ents=[...rect(0,0,sh.L,sh.W,'FOAIE')];
  const gc=[`(GIMMOB Studio - ${ascii(S.name)} - ${base})`,`(Foaie ${sh.L}x${sh.W}x${g.th} - verifica postprocesorul masinii tale)`,'G21 G90 G17','G0 Z25'];
  const byD={};
  sh.parts.forEach(u=>{ents.push(...rect(u.x,u.y,u.w,u.h,'CONTUR_'+g.th));ents.push({t:'T',l:'TEXT',x:u.x+8,y:u.y+8,h:Math.min(20,u.h/4),s:`${u.p.pid} ${ascii(u.p.name)}`});
   for(const ph of placedHoles(u)){const lay=`GAURA_D${ph.h.d}_A${Math.round(ph.h.dep)}`;ents.push({t:'C',l:lay,x:ph.x,y:ph.y,r:ph.h.d/2});(byD[ph.h.d]=byD[ph.h.d]||[]).push(ph);}});
  Object.entries(byD).sort((a,b)=>a[0]-b[0]).forEach(([d,arr],ti)=>{gc.push(`(SCULA T${ti+1} - burghiu D${d})`,`T${ti+1} M6`,'S6000 M3');arr.forEach(ph=>{gc.push(`G0 X${f3(ph.x)} Y${f3(ph.y)}`,`G1 Z${f3(-Math.min(ph.h.dep,g.th))} F1500`,'G0 Z25');});});
  gc.push('(CONTURARE - freza D8, compensare exterioara)','T20 M6','S18000 M3');
  sh.parts.forEach(u=>{const o=4,z=-(g.th+1);gc.push(`(${u.p.pid})`,`G0 X${f3(u.x-o)} Y${f3(u.y-o)}`,`G1 Z${z} F3000`,`G1 X${f3(u.x+u.w+o)} F6000`,`G1 Y${f3(u.y+u.h+o)}`,`G1 X${f3(u.x-o)}`,`G1 Y${f3(u.y-o)}`,'G0 Z25');});
  gc.push('M5','G0 Z50','M30');
  files.push({name:`DXF/${base}.dxf`,data:dxf(ents)},{name:`GCODE/${base}.nc`,data:gc.join('\n')});});});
 files.push({name:'piese.csv',data:'﻿ID;Piesa;Corp;Lungime;Latime;Grosime;Material;Cant L1;Cant L2;Cant W1;Cant W2;Gauri\n'+P.parts.map(p=>[p.pid,p.name,p.cab,p.L,p.W,p.th,p.dec.n,p.edges.L1,p.edges.L2,p.edges.W1,p.edges.W2,p.holes.length].join(';')).join('\n')});
 files.push({name:'gauri.csv',data:'﻿ID piesa;Tip;Fata/Cant;X (pe lungime);Y (pe latime);Diametru;Adancime\n'+P.parts.flatMap(p=>p.holes.map(h=>[p.pid,h.k,h.side,String(h.u).replace('.',','),String(h.v).replace('.',','),h.d,Math.round(h.dep)].join(';'))).join('\n')});
 files.push({name:'CITESTE.txt',data:`GIMMOB Studio - export CNC\nProiect: ${S.name}\nData: ${new Date().toLocaleString('ro-RO')}\n\nDXF/  - cate un fisier pe foaie: straturi FOAIE, CONTUR_<grosime>, GAURA_D<diametru>_A<adancime>, TEXT. Unitati: mm, origine colt stanga-jos.\nGCODE/ - program generic (gaurire + conturare). Verifica si adapteaza la postprocesorul masinii tale inainte de rulare!\npiese.csv - lista piese cu cant (1 = are cant).\ngauri.csv - toate gaurile: fata A/B = gauri pe fata, L1/L2/W1/W2 = gauri in cant (orizontale).\nImbinari: ${JOINS[S.std.join]}\n`});
 return makeZip(files);
}

 $('#pDemo').onclick=()=>{const b=ser();S=demoProject();undoS.push(b);redoS=[];selId=null;rebuildAll();autosave();setCam('3d');closeModal();};
 $('#pExp').onclick=()=>saveFile(`GIMMOB_${S.name.replace(/[^\w-]+/g,'_')}.json`,ser());
 const imp=v=>{try{const o=JSON.parse(v);if(!o.items||!o.room)throw 0;o.pid=nid();undoS.push(ser());load(JSON.stringify(o));setCam('3d');closeModal();toast('Proiect importat');}catch(e){toast('Fișier / cod invalid');}};
 $('#pImpGo').onclick=()=>imp($('#pImp').value.trim());
 $('#pFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(imp);};
 $$('[data-pl]').forEach(b=>b.onclick=()=>{const k=b.dataset.pl;let d=null;if(DB){const p=cloudList.find(x=>x.id===k);d=p&&p.data;}else{const p=localProjects()[k];d=p&&p.d;}if(!d)return;undoS.push(ser());load(d);setCam('3d');closeModal();toast('Deschis: '+S.name);});
 $$('[data-pd]').forEach(b=>b.onclick=async()=>{const k=b.dataset.pd;if(DB){try{await DB.collection('projects').doc(k).delete();}catch(e){toast('Nu am putut șterge');}}else{const L=localProjects();delete L[k];LS.set('gmob.projects',JSON.stringify(L));openProjects();}});
}

 openModal(`${mhead('Bun venit în GIMMOB Studio','Proiectare mobilier la comandă — de la schiță la CNC')}

 <div><span><b>Modifică</b> — atinge corpul: scrii mărimile și <b>codul Egger</b>. Bulinele verzi = lățime, portocalie = înălțime, trage corpul ca să-l muți.</span></div>
 <div><span><b>Producție</b> — debitare, optimizare plăci, etichete, desene, CNC și preț.</span></div></div>
 ${mob?`<div class="note">Un deget = rotești · două degete = zoom / mutare. Ține apăsat pe un corp = meniu rapid.</div>`:
 `<div class="sec"><h4>Scurtături tastatură (laptop)</h4><div class="keys">
 <b>B</b><span>Box Tool — desenează spațiu</span><b>C</b><span>Catalog / schimbă tipul</span>
 <b>Enter</b><span>Spațiu selectat → catalog · în fereastră → Confirmă</span>
 <b>F</b><span>Umple automat spațiul</span><b>S</b> <span>Împarte spațiul stânga-dreapta</span><b>V</b><span>Împarte spațiul sus-jos</span>
 <b>0–9</b><span>Scrie dimensiuni direct (lățime, adâncime, înălțime) + Enter</span>
 <b>← →</b><span>Mută corpul 10 mm (Shift = 100 mm)</span><b>↑ ↓</b><span>Ridică / coboară 10 mm</span>
 <b>D</b><span>Duplică</span><b>M</b><span>Oglindește balamalele</span><b>T</b><span>Întinde rândul</span><b>Del</b><span>Șterge</span>
 <b>1 2 3</b><span>Vedere 3D · Plan · Față</span><b>4</b><span>Cote on/off</span><b>X</b><span>Realist / Raze X / Schelet</span>
 <b>O</b><span>Deschide / închide fronturile</span><b>P</b><span>Producție</span><b>R</b><span>Cameră & proiect</span>
 <b>Ctrl+Z / Ctrl+Y</b><span>Anulează / Refă</span><b>Ctrl+S</b><span>Salvează</span><b>Esc</b><span>Renunță / deselectează</span><b>H</b><span>Acest ajutor</span>
 </div></div>
 <div class="note">Mouse: click stânga + trage = rotești · click dreapta + trage = muți vederea · rotița = zoom · click dreapta pe corp = meniu rapid.</div>`}
 <div style="height:12px"></div><button class="btn gold wide" data-mclose="1">Am înțeles</button>`,!mob);

}
function shot(){
 const sel=selId;selId=null;refreshOverlay();renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/jpeg',.92);selId=sel;refreshOverlay();
 modalState={shot:1};openModal(`${mhead('Captură','Salvează imaginea pentru client')}<img class="shot" src="${url}" alt="Randare proiect"><div style="height:10px"></div><button class="btn gold wide" id="shDl">Descarcă imaginea (JPG)</button>`,true);
 $('#shDl').onclick=async()=>{const bs=atob(url.split(',')[1]),u8=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u8[i]=bs.charCodeAt(i);const b=new Blob([u8],{type:'image/jpeg'});saveFile(`GIMMOB_${S.name.replace(/[^\w-]+/g,'_')}.jpg`,b);};
}

/* ================== BUCLĂ RANDARE ================== */
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);
const tmpV=new THREE.Vector3();
function loop(){
 requestAnimationFrame(loop);
 if(camAnim){camAnim.t=Math.min(1,camAnim.t+.06);const k=1-Math.pow(1-camAnim.t,3);camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(camAnim.t>=1)camAnim=null;}
 if(Math.abs(openT-openTarget)>.001){openT+=(openTarget-openT)*.12;if(Math.abs(openT-openTarget)<.002)openT=openTarget;S.items.forEach(i=>{if(i._open==null)applyOpen(i,openT);});}
 for(const h of handleVis){h.getWorldPosition(tmpV);h.scale.setScalar(camera.position.distanceTo(tmpV)*.013);}
 controls.update();renderer.render(scene,camera);
}
fillEggList();resize();buildRoom();S.items.forEach(rebuildItem);renderPanel();updateTop();setCam('3d',true);applyViewMode();loop();
window.__gmobReady=true;window.__gmob={S:()=>S,inRoom,ovl,okPlace,setKey,production,partsFor,holesFor,select,setTool,openRadial,chooseType,act,fillSpace,runChecks,nesting,allParts,buildCNC,drawingPages,labelPages,openProduction,openChecks,openScan,openStretch,openStd,openCtx};

 modalState={welcome:1};
 openModal(`<div style="text-align:center;padding:6px 4px"><img src="${document.querySelector('.brand img').src}" style="width:120px;border-radius:10px;margin:4px auto 14px;display:block" alt="GIMMOB Studio">
 <h2 style="font-size:26px;margin-bottom:10px">Bun venit în GIMMOB Studio</h2>
 <div style="font-size:17px;line-height:1.5;margin:0 0 18px;color:#ece8e1">Confirmă că <b style="color:var(--gold)">Șerban</b> e cel mai șmecher fiu și că trebuie să îi dai <b style="color:var(--gold)">100 de lei</b> pe aplicație.</div>
 <button class="btn gold wide" id="wOk" style="font-size:16px;padding:14px">Confirm ✓</button></div>`);
 $('#wOk').onclick=()=>{LS.set('gimmob.welcome','1');closeModal(true);toast('Confirmat! Șerban așteaptă cei 100 de lei 😄');if(LS.get('gmob.help')!=='2')setTimeout(openHelp,900);};
}
setTimeout(()=>{$('#splash').classList.add('off');if(!LS.get('gimmob.welcome'))setTimeout(openWelcome,400);else if(LS.get('gmob.help')!=='2')setTimeout(openHelp,500);},700);
</script>
