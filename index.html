<title>GIM MOB Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#141414;--panel2:#1c1c1c;--line:#2a2a2a;--gold:#d8b46e;--gold2:#a77d3c;--txt:#ece8e1;--mut:#9a948a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 380px;grid-template-rows:60px 1fr;grid-template-areas:"top top" "view panel"}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0a0a0a;border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:44px;border-radius:6px;display:block}
.brand b{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.14em;background:linear-gradient(180deg,#f3dca2,#b3843f);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1;white-space:nowrap}
.brand span{font-size:9.5px;letter-spacing:.45em;color:var(--mut);display:block;margin-top:2px}
.pname{flex:1;text-align:center;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname b{color:var(--txt)}
.tb{display:flex;gap:6px;margin-left:auto}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ib svg{width:19px;height:19px}.ib:disabled{opacity:.35}
.tbtn{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:7px;padding:0 12px;cursor:pointer;font:600 13px Inter}
.tbtn svg{width:17px;height:17px;color:var(--gold)}
#view{grid-area:view;position:relative;overflow:hidden;background:#f1efea}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4}
.ptabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid #262626;flex:none}
.ptabs button{flex:1;border:0;background:none;color:var(--mut);padding:11px 6px;font:700 14px Inter;cursor:pointer;border-bottom:2px solid transparent}
.ptabs button.on{color:var(--gold);border-color:var(--gold)}
.pbody{flex:1;overflow:auto;padding:14px 14px 28px;-webkit-overflow-scrolling:touch}
#nav{display:none}
.grab{display:none}
.fbar{position:absolute;display:flex;gap:4px;background:rgba(14,14,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2c2c2c;border-radius:14px;padding:4px;z-index:3}
.fbar button{border:0;background:none;color:#cfc9bf;font:600 12px Inter;padding:7px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}
.fbar button.on{background:linear-gradient(180deg,#e2c27f,#b68c48);color:#141007}
#viewbar{top:12px;right:12px}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(14,14,14,.88);color:#e9e2d4;padding:9px 14px;border-radius:12px;font-size:12.5px;z-index:3;pointer-events:none;max-width:calc(100% - 24px);text-align:center;border:1px solid #3a301c}
#hint:empty{display:none}
/* inventar */
.search{width:100%;background:#0e0e0e;border:1px solid #2e2e2e;border-radius:12px;color:var(--txt);padding:11px 12px;font:500 15px Inter;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--gold2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #2e2e2e;background:#181818;color:#cfc9bf;border-radius:20px;padding:7px 12px;font:600 12.5px Inter;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(180deg,#e2c27f,#b68c48);color:#141007;border-color:#c59c55}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center}
.card:active{transform:scale(.97);border-color:var(--gold2)}
.card .ic{width:100%;aspect-ratio:1.15;background:#fbf7ef;border-radius:10px;display:grid;place-items:center}
.card .ic svg{width:78%;height:78%}
.card b{font:600 11.5px/1.2 Inter}
.card small{font-size:10px;color:var(--mut)}
.cath{grid-column:1/-1;font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:10px 2px 2px}
/* editare */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ph .ic{width:56px;height:56px;border-radius:12px;background:#fbf7ef;display:grid;place-items:center;flex:none}
.ph .ic svg{width:48px;height:48px}
.ph h3{margin:0;font:700 16px Inter}
.ph small{color:var(--mut);font-size:12px}
.sec{border-top:1px solid #242424;padding:12px 0 6px;margin-top:6px}
.sec h4{margin:0 0 10px;font:700 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:block;position:relative}
.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.fld input{width:100%;background:#0e0e0e;border:1px solid #2e2e2e;border-radius:11px;color:var(--txt);padding:12px 34px 12px 11px;font:700 17px Inter;outline:none;-moz-appearance:textfield}
.fld input:focus{border-color:var(--gold2)}
.fld i{position:absolute;right:10px;bottom:14px;font-style:normal;font-size:11px;color:#6d675e;pointer-events:none}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:flex;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:11px;padding:3px;gap:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;color:#bdb6aa;padding:9px 4px;border-radius:8px;font:600 13px Inter;cursor:pointer}
.seg button.on{background:#2a2419;color:var(--gold);box-shadow:inset 0 0 0 1px #4b3c20}
.lab{font-size:12px;color:var(--mut);margin:4px 0 5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #333;background:#1e1e1e;color:var(--txt);border-radius:12px;padding:12px 14px;font:600 14px Inter;cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#e7c784,#b3873f);color:#171108;border-color:#c59c55}
.btn.red{color:#ff8b7b;border-color:#4a2620;background:#1f1412}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;font-weight:600}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#333;border-radius:20px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+i{background:linear-gradient(180deg,#e2c27f,#b68c48)}
.switch input:checked+i:before{transform:translateX(20px)}
.egg{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.egg .sw{width:48px;border-radius:11px;border:1px solid #333;flex:none}
.egg input{flex:1;min-width:0;background:#0e0e0e;border:1px solid #2e2e2e;border-radius:11px;color:var(--txt);padding:12px 11px;font:700 16px Inter;outline:none;text-transform:uppercase}
.egg input:focus{border-color:var(--gold2)}
.eggn{font-size:12px;color:#cfc7b8;margin:-2px 0 6px;min-height:15px}
.eggn.bad{color:#ffb4a8}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{width:30px;height:30px;border-radius:50%;border:2px solid #2b2b2b;cursor:pointer;padding:0}
.quick button.on{border-color:var(--gold)}
.newc{display:flex;gap:8px;align-items:center;margin:4px 0 8px;font-size:12.5px}
.newc input[type=color]{width:46px;height:34px;border:0;background:none;padding:0}
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.card2{background:#151515;border:1px solid #2f2f2f;border-radius:20px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card2.wide{width:min(900px,100%)}
.card2 h2{margin:0 0 4px;font:700 22px 'Cormorant Garamond',serif;letter-spacing:.04em;color:var(--gold)}
.card2 .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.mh{display:flex;align-items:flex-start;gap:10px}.mh .ib{margin-left:auto}
table.cl{width:100%;border-collapse:collapse;font-size:13px}
.cl th{text-align:left;color:var(--gold);font:700 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid #333;position:sticky;top:0;background:#151515}
.cl td{padding:8px 6px;border-bottom:1px solid #222}
.cl td.n{text-align:right;font-variant-numeric:tabular-nums}
.cl tr.grp td{background:#1d1a14;color:var(--gold);font-weight:700}
.tscroll{overflow:auto;max-height:55vh;border:1px solid #262626;border-radius:12px}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pitem{display:flex;align-items:center;gap:8px;background:#1b1b1b;border:1px solid #2a2a2a;border-radius:12px;padding:8px 10px}
.pitem span{flex:1;font-weight:600}
.shot{width:100%;border-radius:12px;display:block;background:#eee}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#1f1a10;border:1px solid #5a4625;color:#f2e6cc;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:80;transition:all .25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#splash img{width:170px;border-radius:10px}
#splash span{font:600 11px Inter;letter-spacing:.5em;color:var(--gold)}
#splash.off{opacity:0;pointer-events:none}
#splash .ld{font:500 12px Inter;letter-spacing:.02em;color:#8a8478;margin-top:6px}
#err{position:fixed;inset:auto 12px 90px 12px;background:#2a1212;color:#ffb4a8;padding:12px;border-radius:12px;z-index:200;font-size:13px;display:none}
@media (max-width:860px){
 #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 66px;grid-template-areas:"top" "view" "nav"}
 #top{padding:0 10px;gap:6px}
 .brand img{height:38px}.brand b{font-size:19px}.brand span{font-size:8.5px}
 .pname,.tbtn{display:none}
 #nav{grid-area:nav;display:flex;background:#0a0a0a;border-top:1px solid var(--line);z-index:30}
 #nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10.5px Inter;cursor:pointer}
 #nav button svg{width:23px;height:23px}
 #nav button.on{color:var(--gold)}
 #panel{position:fixed;left:0;right:0;bottom:66px;height:62vh;border-left:0;border-top:1px solid #3d3220;border-radius:20px 20px 0 0;transform:translateY(calc(100% + 80px));transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:20;box-shadow:0 -14px 40px rgba(0,0,0,.55)}
 #panel.open{transform:none}
 #panel.half{height:44vh}
 .grab{display:block;width:44px;height:5px;border-radius:3px;background:#3a3a3a;margin:8px auto 0;flex:none}
 .ptabs{padding-top:4px}
 #viewbar{top:auto;bottom:12px;right:10px;left:10px;justify-content:center;flex-wrap:wrap}
 #viewbar button{padding:7px 9px;font-size:11.5px}
 #hint{bottom:60px}
 .card2{border-radius:20px 20px 0 0;max-height:92%;align-self:flex-end}
 #modal{padding:0;align-items:flex-end}
}
</style>

function setKey(k,v){let all=false;const it=getSel();

  if(k.startsWith('room.')){const b=k.slice(5);S.room[b]=b==='left'||b==='right'?v==='1':Math.max(1000,+v||1000);all=true;return;}
  if(k.startsWith('def.')){S.def[k.slice(4)]=normCode(v);all=true;return;}
  if(!it)return;
  if(k.startsWith('o.')){const kk=k.slice(2);it.o[kk]=isNaN(+v)||v===''?v:+v;return;}
  if(k==='top.on'){it.top.on=v==='1';return;}
  if(k.startsWith('top.')){const kk=k.slice(4);it.top[kk]=kk==='c'?normCode(v)||null:Math.max(0,+v||0);return;}
  if(k==='cb'||k==='cf'){it[k]=normCode(v)||null;return;}
  if(k==='x'){it.x=(+v||0)+(bbox(it).x1-bbox(it).x0)/2;return;}if(k==='z'){it.z=(+v||0)+(bbox(it).z1-bbox(it).z0)/2;return;}
  if(k==='w'||k==='h'||k==='d'){const old=bbox(it);it[k]=Math.max(10,+v||10);if(k!=='h'){const nb=bbox(it);// păstrează lipit de perete / colț stânga
    if(it.rot===0){it.x+= (nb.x1-nb.x0-(old.x1-old.x0))/2;it.z=old.z0+(nb.z1-nb.z0)/2;}else if(it.rot===90){it.z+=(nb.z1-nb.z0-(old.z1-old.z0))/2;it.x=old.x0+(nb.x1-nb.x0)/2;}else if(it.rot===270){it.z+=(nb.z1-nb.z0-(old.z1-old.z0))/2;it.x=old.x1-(nb.x1-nb.x0)/2;}}return;}

function addItem(k){const t=T[k],it=makeItem(k);const R=S.room;
 // caută loc liber lângă peretele din spate, apoi stânga/dreapta, altfel centru
 const tryAt=(x,z,rot)=>{it.rot=rot;it.x=x;it.z=z;return overlapsOf(it).length===0&&bbox(it).x0>=-1&&bbox(it).x1<=R.w+1&&bbox(it).z1<=R.d+1;};
 let ok=false;
 if(!t.free){for(let x=t.w/2;x<=R.w-t.w/2+1&&!ok;x+=50)ok=tryAt(x,t.d/2,0);
  if(!ok&&R.left)for(let z=t.w/2;z<=R.d-t.w/2&&!ok;z+=50)ok=tryAt(t.d/2,z,90);if(!ok&&R.right)for(let z=t.w/2;z<=R.d-t.w/2&&!ok;z+=50)ok=tryAt(R.w-t.d/2,z,270);}
